flow_2_SELLER_APP_RAISES_THE_COMPLAINT_FOR_POLICY_CATEGORY: # flow2 - 1
  condition:
      operation:
        type: AND
        input:
          value:
          - operation:
                type: EQUAL
                title: Check search message code
                input:
                  value:
                    - operation:
                        type: READ
                        input:
                          value: "req_body.message.issue.actions.0.description.code"
                    - "OPEN"
          - operation:
                type: LENGTH
                title: Check length of actions field
                input:
                  value:
                    - operation:
                        type: READ
                        input:
                          value: "req_body.message.issue.actions"
                    - 1
          - operation:
                type: EQUAL
                title: Check search message code
                input:
                  value:
                    - operation:
                        type: READ
                        input:
                          value: "req_body.message.issue.id"
                    - "ISSUE-2"
  callbacks:
    - callback: "on_issue"
      uri: ""
      delay: 300
      payload:
        $ref: "./template/flow_2_seller_raisies_a_complaint_for_policy_issue/on_issue_1a_buyer_app_responds_with_processing.yaml"
    - callback: "on_issue"
      uri: ""
      delay: 500
      payload:
        $ref: "./template/flow_2_seller_raisies_a_complaint_for_policy_issue/on_issue_1b_buyer_app_responds_with_proposed_solution.yaml"





